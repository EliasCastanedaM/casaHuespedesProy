services:
  - type: web
    name: casa-real-huespedes-backend
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URLS
        value: https://casa-huespedes-proy.vercel.app
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: AI_INTERNAL_TOKEN
        sync: false
      - key: HOTEL_NAME
        value: Casa Huéspedes Pimentel
      - key: HOTEL_WEBSITE
        value: https://casa-huespedes-proy.vercel.app/
