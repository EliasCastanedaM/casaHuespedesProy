name: Security dependency lockfile maintenance (one-time)

on:
  push:
    branches:
      - security/audit-dependencies-ai-access-20261030
    paths:
      - .github/workflows/security-lockfile-maintenance.yml

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Resolve secure dependency ranges
        working-directory: backend
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify backend tests
        working-directory: backend
        run: npm test
      - name: Update security branch lockfile only
        run: |
          git add backend/package.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "No hay cambios de dependencias."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security(deps): refresh audited dependency lockfile"
          git push origin HEAD:refs/heads/security/audit-dependencies-ai-access-20261030
