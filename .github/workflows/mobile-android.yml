name: Build Android Mobile App

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        working-directory: mobile
        run: |
          TEMP_DIR="$(mktemp -d)"
          flutter create "$TEMP_DIR"             --platforms=android             --org com.casahuespedes             --project-name casa_huespedes_mobile
          rm -rf android
          cp -R "$TEMP_DIR/android" android
          rm -rf "$TEMP_DIR"

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"
          fi
          grep -q "android.permission.INTERNET" "$MANIFEST"

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Prepare official Casa Huespedes icon
        working-directory: mobile
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p assets
          curl -fsSL "https://www.casahuespedespimentel.com/img/brand/logo-casa-huespedes.png"             -o assets/logo-casa-huespedes.png
          convert assets/logo-casa-huespedes.png             -gravity West -crop "38%x100%+0+0" +repage -trim             -resize 760x760             assets/logo-emblem.png
          convert -size 1024x1024 xc:"#062B4A"             assets/logo-emblem.png -gravity center -composite             assets/app_icon.png
          dart run flutter_launcher_icons

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: casa-huespedes-pimentel-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
