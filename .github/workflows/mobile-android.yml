name: Build Android Mobile App

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        working-directory: mobile
        run: |
          TEMP_DIR="$(mktemp -d)"
          flutter create "$TEMP_DIR"             --platforms=android             --org com.casahuespedes             --project-name casa_huespedes_mobile
          rm -rf android
          cp -R "$TEMP_DIR/android" android
          rm -rf "$TEMP_DIR"

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - <<'PY'
from pathlib import Path
path = Path("android/app/src/main/AndroidManifest.xml")
text = path.read_text()
permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
network = '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n'
if "android.permission.INTERNET" not in text:
    marker = text.find(">")
    text = text[:marker + 1] + "\n" + permission + network + text[marker + 1:]
path.write_text(text)
PY
          grep -q "android.permission.INTERNET" "$MANIFEST"

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: casa-huespedes-pimentel-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
